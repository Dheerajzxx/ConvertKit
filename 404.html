<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' blob: data:; worker-src 'self' blob:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
  <title>Page not found — ConvertKit</title>
  <meta name="description" content="That page could not be found. Browse the free ConvertKit tools instead.">
  <meta name="theme-color" content="#f8fafc">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="404.html">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <script src="assets/js/theme.js"></script>
</head>
<body data-root="" data-page="404">
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">
    <div class="container">
      <div class="error-page">
        <div>
          <p class="error-page__code">404</p>
          <h1 class="mt-3">This page slipped through the cracks</h1>
          <p class="lead mt-3" style="margin-inline:auto">The link may be broken, or the page may have moved. Try one of the tools below, or head back home.</p>
          <div class="action-row" style="justify-content:center">
            <a class="btn btn-primary" href="index.html">Browse all tools</a>
            <button class="btn btn-secondary" type="button" id="open-palette">Search tools (⌘K)</button>
          </div>

          <div class="related-grid mt-5" id="quick-links"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>
  <script type="module" src="assets/js/common.js"></script>
  <script type="module">
    import { TOOLS, ICONS, getRoot, escapeHtml } from "./assets/js/common.js";
    const root = getRoot();
    const picks = ["merge-pdf", "image-compressor", "excel-to-csv"];
    const host = document.getElementById("quick-links");
    if (host) {
      host.innerHTML = picks
        .map((id) => TOOLS.find((t) => t.id === id))
        .filter(Boolean)
        .map(
          (t) => `<a class="related-card cat-${t.category}" href="${root}${t.path}">
            <span class="related-card__icon" aria-hidden="true">${ICONS[t.icon]}</span>
            <span><span class="related-card__name">${escapeHtml(t.name)}</span>
            <span class="related-card__desc">${escapeHtml(t.desc)}</span></span>
          </a>`
        )
        .join("");
    }
  </script>
</body>
</html>
